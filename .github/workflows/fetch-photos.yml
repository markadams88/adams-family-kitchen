name: Fetch recipe photos
on:
  push:
    paths: ['.github/photo-list.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download each photo in two sizes
        run: |
          mkdir -p photos/sm
          while read -r slug url; do
            [ -z "$slug" ] && continue
            curl -fsSL --retry 3 -o "photos/$slug.jpg" "$url?auto=format&fm=jpg&fit=crop&w=1400&q=72"
            curl -fsSL --retry 3 -o "photos/sm/$slug.jpg" "$url?auto=format&fm=jpg&fit=crop&w=640&h=480&q=70"
          done < .github/photo-list.txt
          ls -la photos photos/sm | head -100
      - name: Save them to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add photos
          git diff --cached --quiet || git commit -m "Store recipe photos on the site"
          git push
